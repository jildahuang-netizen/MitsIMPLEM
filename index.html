<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>MITSI Implementation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: left client tree, breadcrumb header with one New menu, underline tabs, year tabs in the bottom bar.
   Look: MITSI green on graphite-tinted neutrals. The one memorable element is the schedule-vs-work timeline. */
:root{
  --bg:#f2f5f2;--surface:#ffffff;--surface-2:#f7f9f7;
  --ink:#1d2a22;--ink-2:#44524a;--mute:#5d6b62;
  --line:#e0e7e1;--line-2:#ccd6cd;
  --brand:#3c7a42;--brand-hi:#2c6032;--brand-soft:#e5f0e6;--on-brand:#ffffff;
  --info:#2a65a0;--info-soft:#e3edf7;
  --warn:#98600a;--warn-soft:#fbf0dc;
  --bad:#b83a12;--bad-soft:#fbe8e1;--on-bad:#ffffff;
  --ok:#2d7838;--ok-soft:#e2f0e4;
  --track:#e4eae5;--s1:#d3ded4;--s2:#a7c9ab;--s3:#6ba673;
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --gx:28px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101713;--surface:#18211b;--surface-2:#1c261f;
    --ink:#e7efe9;--ink-2:#b9c7bd;--mute:#93a398;
    --line:#2a372e;--line-2:#3a4b3e;
    --brand:#5fae67;--brand-hi:#7cc384;--brand-soft:#1f3624;--on-brand:#0d1a10;
    --info:#6aa8dd;--info-soft:#1b2b3a;
    --warn:#e0ac4f;--warn-soft:#352a14;
    --bad:#f08b66;--bad-soft:#38211a;--on-bad:#2a0f06;
    --ok:#6cc277;--ok-soft:#1d3322;
    --track:#26332a;--s1:#2f4034;--s2:#41684a;--s3:#55915f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101713;--surface:#18211b;--surface-2:#1c261f;
  --ink:#e7efe9;--ink-2:#b9c7bd;--mute:#93a398;
  --line:#2a372e;--line-2:#3a4b3e;
  --brand:#5fae67;--brand-hi:#7cc384;--brand-soft:#1f3624;--on-brand:#0d1a10;
  --info:#6aa8dd;--info-soft:#1b2b3a;
  --warn:#e0ac4f;--warn-soft:#352a14;
  --bad:#f08b66;--bad-soft:#38211a;--on-bad:#2a0f06;
  --ok:#6cc277;--ok-soft:#1d3322;
  --track:#26332a;--s1:#2f4034;--s2:#41684a;--s3:#55915f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.small{font-size:13px;color:var(--mute)}
.nw{white-space:nowrap}
.muted{color:var(--mute)}

/* shell */
.shell{height:100%;display:flex;flex-direction:column;min-height:0}
.app{flex:1;min-height:0;display:grid;grid-template-columns:288px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-in{flex:1;overflow-y:auto;padding:14px 12px 12px max(12px,env(safe-area-inset-left,0px))}
.side-foot{padding:10px 12px 12px max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.side-foot .btn{width:100%}
.brand{padding:4px 8px 16px}
.brand img{display:block;width:148px;max-width:100%;height:auto}
:root[data-theme="dark"] .brand img{filter:brightness(1.45) saturate(1.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand img{filter:brightness(1.45) saturate(1.1)}}
.main{overflow-y:auto;min-width:0;padding:24px max(var(--gx),env(safe-area-inset-right,0px)) 48px max(var(--gx),env(safe-area-inset-left,0px))}
.scrim{display:none}
.icon-btn.menu-btn{display:none}

/* sidebar tree */
.ni{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:6px 10px;border:0;border-radius:8px;background:none;text-align:left;font-weight:500;color:var(--ink-2)}
.ni:hover{background:var(--surface-2);color:var(--ink)}
.ni.on{background:var(--brand-soft);color:var(--brand-hi);font-weight:600}
.ni-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni-n{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.ni.on .ni-n{color:var(--brand-hi)}
.nlabel{font-size:13px;color:var(--mute);padding:16px 10px 6px;font-weight:600}
.cg{margin-bottom:2px}
.ch{display:flex;align-items:center;gap:2px}
.chev{width:26px;height:30px;border:0;background:none;display:grid;place-items:center;border-radius:6px;color:var(--mute);flex:none}
.chev:hover{background:var(--surface-2);color:var(--ink)}
.chev .ic{width:15px;height:15px;transition:transform .15s}
.chev.open .ic{transform:rotate(90deg)}
.cn{font-weight:600;color:var(--ink)}
.cp{margin:2px 0 6px 26px;border-left:1px solid var(--line);padding-left:6px}
.pj{min-height:32px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.ni.add{color:var(--brand-hi);font-size:13.5px;font-weight:600}
.flag{width:15px;height:15px;flex:none}
.flag.warn{color:var(--warn)}.flag.bad{color:var(--bad)}

/* header */
.top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.top-main{flex:1 1 320px;min-width:0}
.link{border:0;background:none;padding:0;color:var(--brand-hi);font-weight:600;text-decoration:underline}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13.5px;color:var(--mute);margin-bottom:6px}
.crumbs .ic{width:14px;height:14px}
.crumb{border:0;background:none;padding:2px 4px;border-radius:5px;color:var(--mute);font-weight:500}
.crumb:hover{color:var(--brand-hi);background:var(--brand-soft)}
.title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.sub{margin-top:6px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 18px;font-size:14px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nw-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;padding:6px;box-shadow:0 14px 34px rgba(16,30,20,.18);z-index:30}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border:0;background:none;border-radius:7px;text-align:left;font-weight:500}
.menu button:hover{background:var(--brand-soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;margin-bottom:-1px;font-weight:600;color:var(--mute);white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tab .n{font-size:12px;background:var(--track);color:var(--ink-2);border-radius:99px;padding:1px 8px;font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools:empty{display:none}
.tools .sp{flex:1}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:0 13px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand-hi)}
.btn .ic{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hi);border-color:var(--brand-hi);color:var(--on-brand)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--track);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn:disabled{opacity:.5;cursor:default;pointer-events:none}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:8px;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--track);color:var(--ink)}
.icon-btn.bad:hover{color:var(--bad)}
.icon-btn .ic{width:17px;height:17px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:0 10px;min-height:36px;max-width:100%}
textarea{padding:8px 10px;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 24%,transparent)}
input[type="checkbox"]{min-height:0;width:16px;height:16px;padding:0;accent-color:var(--brand)}
select.sel{min-height:28px;border-radius:99px;font-size:12.5px;font-weight:600;padding:0 6px}
.inl{min-height:30px;font-size:13.5px;width:140px}
.search{position:relative;display:block}
.search input{padding-left:32px;width:250px}
.search .ic{position:absolute;left:10px;top:10px;width:16px;height:16px;color:var(--mute);pointer-events:none}
.seg{display:inline-flex;background:var(--track);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--track);color:var(--ink-2);border:0}
.pill .ic{width:12px;height:12px;stroke-width:2.4}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
button.pill:hover{filter:brightness(.95)}
.dt{font-size:13px;color:var(--mute);white-space:nowrap}
.av{--h:150;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;flex:none;background:hsl(var(--h) 38% 85%);color:hsl(var(--h) 55% 24%)}
:root[data-theme="dark"] .av{background:hsl(var(--h) 28% 26%);color:hsl(var(--h) 60% 84%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 28% 26%);color:hsl(var(--h) 60% 84%)}}
.ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:inline-grid;place-items:center;padding:0;flex:none;color:transparent}
.ck:hover{border-color:var(--brand);color:var(--brand)}
.ck.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.ck .ic{width:12px;height:12px;stroke-width:3}
.tlink{background:none;border:0;padding:0;font-weight:600;color:var(--ink);text-align:left}
.tlink:hover{color:var(--brand-hi);text-decoration:underline}

/* panels and overview */
.ov{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.ph h2{font-size:15px;font-weight:700}
.pb{padding:4px 16px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px}
.kl{font-size:13px;color:var(--mute);font-weight:500}
.kv{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.kv.bad{color:var(--bad)}
.ks{font-size:13px;color:var(--ink-2);margin-top:2px}
.kpi .trk{margin-top:8px;height:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--surface-2)}
.rt{flex:1;min-width:0}
.rt .tlink{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.good{display:flex;gap:10px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);color:var(--ink-2)}
.good .ic{color:var(--ok)}
.tl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tl-big{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tl-row{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;gap:10px;align-items:center;margin:10px 0;font-size:13.5px;color:var(--ink-2)}
.tl-row b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.trk{height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px}
.f-time{background:var(--info)}.f-work{background:var(--brand)}
.tl-dates{display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:12px;border-top:1px dashed var(--line-2);padding-top:10px}
.tl-note{margin-top:10px;font-size:13.5px;color:var(--warn);display:flex;gap:6px;align-items:center}
.stk{display:flex;gap:2px;height:12px}
.stk i{display:block;border-radius:3px;min-width:6px}
.lg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:13.5px;color:var(--ink-2)}
.lg span{display:inline-flex;align-items:center;gap:7px}
.lg b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw-todo,.stk .s-todo{background:var(--s1)}.sw-doing,.stk .s-doing{background:var(--s2)}.sw-review,.stk .s-review{background:var(--s3)}.sw-done,.stk .s-done{background:var(--brand)}
.tip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--brand-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.tip span{flex:1;min-width:200px}
.welcome{padding:26px 24px;max-width:640px}
.welcome h2{font-size:20px;font-weight:700;margin-bottom:6px}
.welcome ol{margin:14px 0 20px;padding-left:20px;display:grid;gap:8px;color:var(--ink-2)}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:32px 20px;text-align:center;color:var(--ink-2);display:grid;gap:12px;justify-items:center}
.empty b{color:var(--ink);font-size:16px}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
th{font-weight:600;font-size:13px;color:var(--mute);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tr.sel,tr.sel:hover{background:var(--brand-soft)}
tr.done .tlink{color:var(--mute);text-decoration:line-through}
.c-ck{width:44px}
.mini{display:flex;align-items:center;gap:10px}
.mini .trk{width:110px;height:8px;flex:none}
.mini b{font-variant-numeric:tabular-nums;font-size:13.5px}
.pt td{padding-top:12px;padding-bottom:12px}
.addr td{background:var(--surface-2)}
.inl-add{display:flex;align-items:center;gap:8px;color:var(--mute)}
.inl-add input{flex:1;border-style:dashed;min-width:0}
.bulk{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;background:var(--brand-soft);border-radius:10px;padding:8px 12px}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.col.over{outline:2px dashed var(--brand);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px}
.col-h h3{font-size:14px;font-weight:700}
.col-h .n{margin-left:auto;font-size:12.5px;color:var(--mute);font-weight:600}
.col-b{display:grid;gap:8px}
.col-empty{font-size:13px;color:var(--mute);padding:14px 6px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;display:grid;gap:8px}
.card:hover{border-color:var(--line-2)}
.card-top{display:flex;gap:10px;align-items:flex-start}
.card-t{font-weight:600;line-height:1.3;flex:1;min-width:0;overflow-wrap:anywhere}
.card.done .card-t{color:var(--mute);text-decoration:line-through}
.card-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-left:30px}
.card-m .av{margin-left:auto}
.qa input{width:100%;background:transparent;border-style:dashed}

/* trainings */
.tr-list{display:grid;gap:16px}
.tr-meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:13.5px;color:var(--ink-2);margin-top:3px}
.tr-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tr .tw{border:0;border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.ra{display:flex;gap:2px;justify-content:flex-end}

/* dialog */
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));max-height:min(90%,860px);box-shadow:0 24px 70px rgba(10,20,14,.35)}
dialog[open]{display:flex;flex-direction:column;animation:pop .14s ease-out}
dialog.wide{width:min(620px,calc(100vw - 32px))}
dialog.xl{width:min(920px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(12,20,15,.5)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 16px 6px 20px}
.dh h2{font-size:18px;font-weight:700}
.db{padding:8px 20px 6px;overflow-y:auto;min-height:0}
.db p{color:var(--ink-2);margin-bottom:8px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 20px 18px}
.acts .sp{flex:1}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);min-width:0}
.f .w{grid-column:1/-1}
.f label small{font-weight:400;color:var(--mute)}
.ctx{display:flex;gap:8px;align-items:center;color:var(--ink-2);font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ctx .ic{width:16px;height:16px;color:var(--brand)}
.sec{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}
.sec h3{font-size:15px;font-weight:700;margin-bottom:2px}
.sec .small{margin-bottom:10px;display:block}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0}
.saved{font-size:13px;color:var(--ok);min-height:18px;margin-top:6px}

/* bottom bar and toast */
.bar{flex:none;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);background:var(--surface);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.years{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:2px}
.yr{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 13px;font-weight:600;color:var(--ink-2);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.yr:hover{border-color:var(--brand)}
.yr[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.yr small{font-weight:600;opacity:.8;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:16px;align-items:center;z-index:60;max-width:calc(100vw - 32px);box-shadow:0 12px 30px rgba(0,0,0,.3);font-size:14px}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0;white-space:nowrap}

@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  :root{--gx:16px}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(12,20,15,.45);z-index:35}
  .icon-btn.menu-btn{display:inline-grid}
  .main{padding-top:14px}
  .top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
  .top-actions{grid-column:1/-1}
  .search input{width:100%}
  .search{flex:1 1 200px}
  h1{font-size:22px}
  .f{grid-template-columns:1fr}
}
@media (max-width:520px){
  .bar .btn span{display:none}
  .toast{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.sgb{margin-top:12px;display:grid;gap:8px}.sgr{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px 8px;align-items:center;min-width:0}.sgr input{min-width:0}.sgl{font-weight:600;grid-column:1/-1}
.sgd{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;display:grid;gap:8px}.sgd.foc{border-color:var(--ac,var(--info))}
.sgh{display:flex;justify-content:space-between;gap:10px;align-items:center}.sgs{display:grid;gap:6px}.sgchk{display:flex;gap:8px;align-items:center}
.sgq{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;align-items:center}
.bar-r{display:flex;gap:4px;align-items:center}
@media(max-width:700px){.sgr,.sgq{grid-template-columns:1fr}.bar-r .btn span:not(.pill){display:none}}
textarea,.sgq input,.sgr input{font-weight:400}
.sgq{grid-template-columns:140px 1fr 1.3fr}
.sgchk{flex-direction:row!important;white-space:nowrap;font-weight:600;align-items:center;gap:8px}
.sgchk input[type=checkbox]{width:auto;flex:none}
@media(max-width:700px){.sgq{grid-template-columns:1fr}}
.sgq input,.sgr input{min-width:0;width:100%;box-sizing:border-box}.sgq{min-width:0}

.rs{display:flex;gap:2px 14px;overflow:hidden;white-space:nowrap}.file-btn:focus-within{outline:2px solid var(--info);outline-offset:2px}
</style>

const late=t=>t.due&&t.status!=='done'&&t.due<day(0);
function dueTxt(t){
  if(!t.due)return{txt:'No date',cls:''};
  if(t.status==='done')return{txt:fmt(t.due),cls:''};
  const d=dd(day(0),t.due);
  if(d<0)return{txt:(-d)+(d===-1?' day':' days')+' overdue',cls:'bad'};
  if(d===0)return{txt:'Due today',cls:'warn'};
  if(d===1)return{txt:'Due tomorrow',cls:'warn'};
  if(d<=7)return{txt:'Due in '+d+' days',cls:'info'};
  return{txt:fmt(t.due),cls:''};
}
const dueChip=t=>{const o=dueTxt(t);return o.cls?`<span class="pill ${o.cls}">${o.cls==='bad'?ic('alert'):''}${o.txt}</span>`:`<span class="dt">${o.txt}</span>`};
function sched(p){
  if(!p.ntp||!p.due)return null;
  const t=day(0),total=Math.max(1,dd(p.ntp,p.due)),el=dd(p.ntp,t);
  return{total,el,left:dd(t,p.due),pct:clamp(Math.round(el/total*100),0,100),started:el>=0};
}
const sd=d=>new Date(d+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function pStat(p){
  const T=S.tasks.filter(t=>t.pid===p.id),Dl=S.deliv.filter(x=>x.pid===p.id),dn=T.filter(t=>t.status==='done').length,od=T.filter(late).length;
  const pct=T.length?Math.round(dn/T.length*100):0,sc=sched(p);
  let st;
  if(!T.length)st='Not started';
  else if(dn===T.length)st='Completed';
  else if(p.due&&p.due<day(0))st='Delayed';
  else if(od||(sc&&sc.started&&sc.pct-pct>=20))st='At risk';
  else st='On track';
  return{T:T.length,dn,od,D:Dl.length,dd:Dl.filter(x=>x.delivered).length,pct,st,sc};
}
const HP={'Completed':['ok','check'],'On track':['ok','check'],'At risk':['warn','alert'],'Delayed':['bad','alert'],'Not started':['','dash']};
const healthPill=st=>{const h=HP[st];return `<span class="pill ${h[0]}">${ic(h[1])}${st}</span>`};
function leftTxt(p){
  const sc=sched(p);if(!p.due)return 'No deadline';
  const left=dd(day(0),p.due);
  if(left<0)return (-left)+(left===-1?' day':' days')+' past deadline';
  if(left===0)return 'Deadline today';
  if(sc&&!sc.started)return 'Starts in '+(-sc.el)+(sc.el===-1?' day':' days');
  return left+(left===1?' day':' days')+' left';
}

   `<button class="btn" onclick="qCopy()">${ic('copy')}Copy message</button><a class="btn" id="q_mail" target="_blank" rel="noopener">Open in email app</a><span class="sp"></span><button class="btn" onclick="openSignoffs('${id}')">Back</button><button class="btn primary" onclick="qSent('${id}')">I've sent it</button>`,'wide');
  qRefresh(id,true);
}
function qRows(){return [0,1,2].map(i=>({on:$('q_on'+i).checked,name:$('q_n'+i).value.trim(),email:$('q_e'+i).value.trim()}))}
function qRefresh(id,keep){
  const d=docOf(id),r=qRows(),to=r.filter(x=>x.on&&x.email).map(x=>x.email).join(',');
  if(!keep){const k=d.type==='df'?'df':'rp';$('q_m').value=reqText(d,r.map((x,i)=>({...x})))}
  $('q_mail').href='mailto:'+encodeURIComponent(to).replace(/%2C/g,',').replace(/%40/g,'@')+'?subject='+encodeURIComponent('Signature request: '+d.no)+'&body='+encodeURIComponent($('q_m').value);
}
async function qCopy(){const t=$('q_m');try{await navigator.clipboard.writeText(t.value);toast('Message copied.')}catch(e){t.select();toast('Press Ctrl+C to copy the selected text.')}}
function qSent(id){
  const d=docOf(id),k=d.type==='df'?'df':'rp',r=qRows(),old=d.signers||[];
  const sel=r.map((x,i)=>({...x,label:SG_LBL[k][i]})).filter(x=>x.on);
  if(!sel.length){toast('Choose at least one signer.');return}
  if(sel.some(x=>!x.name)){toast('Add a name for each selected signer.');return}
  d.signers=sel.map(x=>{const o=old.find(s=>s.label===x.label);return{label:x.label,name:x.name,email:x.email,signed:o?o.signed:false,signedOn:o?o.signedOn:''}});
  d.sent=day(0);delete d._rows;save();openSignoffs(id);render();toast('Marked as sent. It will show under Needs attention if no one signs in 3 days.');
}

/* ===== Views: overview, board, list, deliverables, training ===== */
const panel=(t,b,r)=>`<section class="panel"><div class="ph"><h2>${t}</h2>${r||''}</div>${b}</section>`;
const kpi=(l,v,s,x,c)=>`<div class="kpi"><div class="kl">${l}</div><div class="kv ${c||''}">${v}</div><div class="ks">${s}</div>${x||''}</div>`;
const trk=(pct,c)=>`<div class="trk" role="img" aria-label="${pct} percent"><i class="${c}" style="width:${pct}%"></i></div>`;
const go=v=>{setView(v)};
function noProj(){return `<div class="empty"><b>No projects yet</b><span>Add a client or agency, then create its first project.</span><button class="btn primary" onclick="newProject()">New project</button></div>`}
function welcome(){
  return `<section class="panel welcome"><h2>Welcome to MITSI Implementation</h2><p class="muted">Set up your first project in three steps.</p>
  <ol><li>Add the client or agency. Contact details are typed once and reused on every form.</li><li>Create a project and enter its NTP date and days of implementation. The deadline fills itself in.</li><li>Track tasks, deliverables and trainings, then download delivery forms, reports and certificates already filled in.</li></ol>
  <button class="btn primary" onclick="editClient()">${ic('plus')}Add a client or agency</button></section>`;
}
function ovHTML(){
  if(!S.clients.length&&!S.projects.length)return welcome();
  const p=proj(S.sel),cl=curClient();
  const ps=p?[p]:projList().filter(x=>!cl||x.cid===cl.id);
  let h='';
  if(hasSample())h+=`<div class="tip"><span>You are looking at sample data. Remove it when you are ready to add your own.</span><button class="btn sm" onclick="askSample()">Remove sample data</button></div>`;
  if(!ps.length)return `<div class="ov">${h}<div class="empty"><b>No projects${cl?' for '+esc(cl.name):''} in ${S.year==='all'?'any year':S.year}</b><span>A project appears under the year of its NTP date.</span><button class="btn primary" onclick="newProject(${cl?`'${cl.id}'`:''})">New project</button></div></div>`;
  const ids=new Set(ps.map(x=>x.id)),T=S.tasks.filter(t=>ids.has(t.pid)),Dl=S.deliv.filter(x=>ids.has(x.pid));
  const done=T.filter(t=>t.status==='done').length,od=T.filter(late).length,soon=T.filter(t=>t.status!=='done'&&t.due&&t.due>=day(0)&&t.due<=day(7)).length,dn=Dl.filter(x=>x.delivered).length;
  const pct=T.length?Math.round(done/T.length*100):0;
  const k=[];
  k.push(p?kpi('Progress',pct+'%',`${done} of ${T.length} tasks done`,trk(pct,'f-work')):kpi('Projects',ps.length,`${ps.filter(x=>pStat(x).st==='Completed').length} completed`));
  k.push(p?kpi('Open tasks',T.length-done,`${soon} due in the next 7 days`):kpi('Task progress',pct+'%',`${done} of ${T.length} tasks done`,trk(pct,'f-work')));
  k.push(kpi('Deliverables',`${dn}<span class="muted" style="font-size:16px"> of ${Dl.length}</span>`,Dl.length-dn?`${Dl.length-dn} awaiting delivery`:Dl.length?'All delivered':'None added yet'));
  k.push(kpi('Overdue',od,od?'Tasks past their due date':'Nothing overdue',null,od?'bad':''));
  h+=`<div class="strip">${k.join('')}</div>`;
  const at=attnPanel(ps,!p),aw=awaitPanel(ps,!p);
  if(p)h+=`<div class="grid2"><div class="stack">${timelineP(p)}${statusP(T)}</div><div class="stack">${at}${aw}</div></div>`+trainP(ps);
  else h+=portfolio(ps,cl)+`<div class="grid2">${at}${aw}</div>`+trainP(ps);
  return `<div class="ov">${h}</div>`;
}
function timelineP(p){
  const s=pStat(p),sc=s.sc;
  if(!sc)return panel('Schedule',`<div class="pb"><p class="muted" style="margin-bottom:12px">Add an NTP date and the days of implementation to compare time used with work done.</p><button class="btn sm" onclick="editProj('${p.id}')">Set the schedule</button></div>`);
  const tp=sc.started?sc.pct:0,gap=tp-s.pct;
  return panel('Schedule',`<div class="pb"><div class="tl-head"><div class="tl-big">${esc(leftTxt(p))}</div>${healthPill(s.st)}</div>
   <div class="tl-row"><span>Time used</span>${trk(tp,'f-time')}<b>${tp}%</b></div>
   <div class="tl-row"><span>Work done</span>${trk(s.pct,'f-work')}<b>${s.pct}%</b></div>
   ${s.st!=='Completed'&&sc.started&&gap>=10?`<div class="tl-note">${ic('alert')}Work done is ${gap} points behind time used.</div>`:''}
   <div class="tl-dates"><span>NTP ${fmtY(p.ntp)}</span>${p.days?`<span>${p.days} days</span>`:''}<span>Deadline ${fmtY(p.due)}</span></div></div>`);
}
function statusP(T){
  if(!T.length)return panel('Tasks by status',`<div class="pb"><p class="muted" style="margin-bottom:12px">No tasks yet. Add the first one from the board.</p><button class="btn sm" onclick="setView('board')">Open board</button></div>`);
  const c=Object.fromEntries(ST.map(([k])=>[k,T.filter(t=>t.status===k).length]));
  return panel('Tasks by status',`<div class="pb"><div class="stk" role="img" aria-label="${ST.map(([k,l])=>l+' '+c[k]).join(', ')}">${ST.map(([k])=>c[k]?`<i class="s-${k}" style="flex:${c[k]}"></i>`:'').join('')}</div><div class="lg">${ST.map(([k,l])=>`<span><i class="sw sw-${k}"></i>${l} <b>${c[k]}</b></span>`).join('')}</div></div>`,`<button class="btn sm ghost" onclick="setView('board')">Open board</button>`);
}
function attnPanel(ps,multi){
  const ids=new Set(ps.map(x=>x.id)),t7=day(7);
  const L=S.tasks.filter(t=>ids.has(t.pid)&&t.status!=='done'&&t.due&&t.due<=t7).sort((a,b)=>a.due.localeCompare(b.due));
  const rows=docRows(ids,multi)+L.slice(0,6).map(t=>{const p=proj(t.pid);
    return `<div class="row" onclick="editTask('${t.id}')"><button class="ck" onclick="event.stopPropagation();toggleDone('${t.id}')" aria-label="Mark done: ${esc(t.title)}">${ic('check')}</button><div class="rt"><button class="tlink" onclick="event.stopPropagation();editTask('${t.id}')">${esc(t.title)}</button>${multi&&p?`<span class="rs">${esc(label(p))}</span>`:''}</div>${dueChip(t)}${av(t.owner)}</div>`}).join('');
  return panel('Needs attention',rows||`<div class="good">${ic('check')}Nothing is overdue or due this week.</div>`,L.length>6?`<button class="btn sm ghost" onclick="setView('list')">See all ${L.length}</button>`:'');
}
function awaitPanel(ps,multi){
  const ids=new Set(ps.map(x=>x.id)),all=S.deliv.filter(x=>ids.has(x.pid)),L=all.filter(x=>!x.delivered);
  const rows=L.slice(0,6).map(x=>{const p=proj(x.pid);

  return panel('Awaiting delivery',rows||`<div class="good">${ic('check')}${all.length?'Everything has been delivered.':'No deliverables added yet.'}</div>`,L.length>6?`<button class="btn sm ghost" onclick="setView('deliv')">See all ${L.length}</button>`:'');
}
function trainP(ps){
  const ids=new Set(ps.map(x=>x.id)),L=S.trainings.filter(t=>ids.has(t.pid)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,4);

  return panel('Trainings',L.map(t=>`<div class="row" onclick="setView('train')"><div class="rt"><button class="tlink" onclick="event.stopPropagation();setView('train')">${esc(t.title)}</button><span class="rs">${t.date?`<span>${longD(t.date)}</span>`:''}<span>${t.parts.length} participant${t.parts.length===1?'':'s'}</span></span></div>${t.parts.length?`<button class="btn sm" onclick="event.stopPropagation();certs('${t.id}')">${ic('dl')}Certificates</button>`:''}</div>`).join(''));

function portfolio(ps,cl){
  const rows=[...ps].sort((a,b)=>{const ca=pStat(a).st==='Completed',cb=pStat(b).st==='Completed';if(ca!==cb)return ca?1:-1;return (a.due||'9').localeCompare(b.due||'9')}).map(x=>{

    return `<tr><td><button class="tlink" onclick="pick('${x.id}')">${esc(x.name)}</button>${!cl&&c.name?`<div class="small">${esc(c.name)}</div>`:''}</td><td class="nw">${x.due?fmtY(x.due):'<span class="small">No deadline</span>'}<div class="small">${esc(leftTxt(x))}</div></td><td><div class="mini">${trk(s.pct,'f-work')}<b>${s.pct}%</b></div><div class="small">${s.dn} of ${s.T} tasks</div></td><td>${healthPill(s.st)}</td></tr>`}).join('');

}

/* ----- board and list ----- */
function visibleTasks(){return S.tasks.filter(t=>inSc(t.pid)&&(!fp||t.pri===fp)&&(!q||(t.title+' '+(t.owner||'')).toLowerCase().includes(q.toLowerCase())))}

/* ----- deliverables ----- */
function dItems(){return S.deliv.filter(x=>inSc(x.pid)&&(dv==='all'||(dv==='yes')===x.delivered)&&(!q||(x.name+' '+(x.notes||'')+' '+(x.sn||'')).toLowerCase().includes(q.toLowerCase())))}

/* ----- trainings ----- */

   (n?`<div class="tw"><table><thead><tr><th>#</th><th>Participant</th><th>Position or office</th><th></th></tr></thead><tbody>${t.parts.map((x,i)=>`<tr><td class="small">${i+1}</td><td><b>${esc(x.name)}</b></td><td>${x.org?esc(x.org):'<span class="small">-</span>'}</td><td><div class="ra"><button class="icon-btn" onclick="previewCert('${t.id}',${i})" aria-label="Preview certificate for ${esc(x.name)}" title="Preview">${ic('eye')}</button><button class="icon-btn" onclick="certs('${t.id}','${x.id}')" aria-label="Download certificate for ${esc(x.name)}" title="Download">${ic('dl')}</button><button class="icon-btn" onclick="editPart('${t.id}','${x.id}')" aria-label="Edit ${esc(x.name)}" title="Edit">${ic('pencil')}</button><button class="icon-btn bad" onclick="delPart('${t.id}','${x.id}')" aria-label="Remove ${esc(x.name)}" title="Remove">${ic('trash')}</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="good">No participants yet. Use Participants to paste in the names.</div>`)+`</section>`;
}

/* ===== Quick actions (no dialog needed) ===== */
function toggleDone(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;const prev=t.status;t.status=prev==='done'?'todo':'done';save();render();toast(t.status==='done'?'Task marked done.':'Task reopened.','Undo',()=>{t.status=prev;save();render()})}
function setStatus(id,s){const t=S.tasks.find(x=>x.id===id);if(t){t.status=s;save();render()}}
function qAdd(e,st){e.preventDefault();const p=proj(S.sel),i=e.target.querySelector('input'),title=i.value.trim();if(!p||!title)return false;S.tasks.push({id:uid(),pid:p.id,title,status:st,pri:'med',owner:'',due:'',notes:''});save();focusId='qa-'+st;render();return false}
function dAdd(e){e.preventDefault();const p=proj(S.sel),i=e.target.querySelector('input'),name=i.value.trim();if(!p||!name)return false;S.deliv.push({id:uid(),pid:p.id,name,qty:'1',unit:S.last.unit||'pc',sn:'',notes:'',delivered:false,date:'',dr:''});save();focusId='da';render();return false}
function togDel(id){const x=S.deliv.find(d=>d.id===id);if(!x)return;const pd=x.delivered,pdt=x.date;x.delivered=!pd;x.date=x.delivered?day(0):'';save();render();toast(x.delivered?'Marked delivered today.':'Marked undelivered.','Undo',()=>{x.delivered=pd;x.date=pdt;save();render()})}
function setDelDate(id,v){const x=S.deliv.find(d=>d.id===id);if(x&&v){x.date=v;save()}}
function tog(id,c){c?selD.add(id):selD.delete(id);const r=$('dr-'+id);if(r)r.classList.toggle('sel',c);toolsR()}
function togAll(c){dItems().forEach(x=>c?selD.add(x.id):selD.delete(x.id));refresh()}
function bulkDeliver(){const L=S.deliv.filter(x=>selD.has(x.id)&&!x.delivered);if(!L.length){toast('The selected items are already delivered.');return}L.forEach(x=>{x.delivered=true;x.date=day(0)});selD.clear();save();render();toast(L.length+' marked delivered today.','Undo',()=>{L.forEach(x=>{x.delivered=false;x.date=''});save();render()})}

function fillIfEmpty(map){Object.entries(map).forEach(([k,v])=>{const e=$(k);if(e&&!e.value&&v)e.value=v})}
function autoTitle(v){const t=[...S.trainings].reverse().find(x=>x.title===v);if(t)fillIfEmpty({t_k:t.skill,t_h:t.hours,t_tn:t.tn,t_tt:t.tt,t_to:t.to})}
function autoTrainer(v){const t=[...S.trainings].reverse().find(x=>x.tn===v&&(x.tt||x.to));if(t)fillIfEmpty({t_tt:t.tt,t_to:t.to})}
function saveTraining(id){
  const title=$('t_t').value.trim();if(!title){$('t_t').focus();return}
  const v={pid:$('t_p').value,title,skill:$('t_k').value.trim(),date:$('t_d').value,hours:$('t_h').value.trim(),tn:$('t_tn').value.trim(),tt:$('t_tt').value.trim(),to:$('t_to').value.trim()};
  S.last={...S.last,hours:v.hours,tn:v.tn,tt:v.tt,to:v.to};
  if(id)Object.assign(S.trainings.find(x=>x.id===id),v);else S.trainings.push({id:uid(),parts:[],...v});
  save();closeDlg();render();
}
function delTraining(id){ask('Delete this training?','The training and its participant list are removed.','Delete training',()=>{S.trainings=S.trainings.filter(x=>x.id!==id);save();render()},true)}
function dupTraining(id){
  const t=S.trainings.find(x=>x.id===id);if(!t)return;
  const n=JSON.parse(JSON.stringify(t));n.id=uid();n.title=t.title+' (copy)';n.date=day(0);delete n.sample;n.parts.forEach(x=>{x.id=uid()});
  S.trainings.push(n);save();render();editTraining(n.id);
}
function addParts(id){
  const others=S.trainings.filter(t=>t.id!==id&&t.parts.length);
  openDlg('Add participants',`<div class="f"><label class="w">Names, one per line <small>Add a position or office after a comma if you want it listed.</small><textarea id="p_n" rows="7" placeholder="Juan Dela Cruz, IT Officer&#10;Maria Santos, Records Division"></textarea></label>${others.length?`<label class="w">Or copy everyone from another training<select id="p_c"><option value="">Do not copy</option>${others.map(t=>`<option value="${t.id}">${esc(t.title)} (${t.parts.length})</option>`).join('')}</select></label>`:''}</div>`,
   `<span class="sp"></span><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="saveParts('${id}')">Add participants</button>`,'','p_n');
}
function saveParts(id){
  const t=S.trainings.find(x=>x.id===id),ls=$('p_n').value.split('\n').map(s=>s.trim()).filter(Boolean),src=$('p_c')&&$('p_c').value;
  const have=new Set(t.parts.map(x=>x.name.toLowerCase())),add=[];
  ls.forEach(l=>{const i=l.indexOf(','),n=(i<0?l:l.slice(0,i)).trim();if(n)add.push({name:n,org:i<0?'':l.slice(i+1).trim()})});
  if(src){const o=S.trainings.find(x=>x.id===src);if(o)o.parts.forEach(x=>add.push({name:x.name,org:x.org}))}
  let n=0;add.forEach(x=>{if(have.has(x.name.toLowerCase()))return;have.add(x.name.toLowerCase());t.parts.push({id:uid(),name:x.name,org:x.org});n++});
  if(!n){toast(add.length?'Those participants are already on the list.':'Type at least one name.');return}
  save();closeDlg();render();toast(n+' participant'+(n===1?'':'s')+' added.');
}
function editPart(tid,xid){
  const x=S.trainings.find(t=>t.id===tid).parts.find(p=>p.id===xid);
  openDlg('Edit participant',`<div class="f"><label class="w">Full name <small>Printed on the certificate</small><input id="p_e" value="${esc(x.name)}" autocomplete="off"></label><label class="w">Position or office <small>Optional</small><input id="p_o" list="dl-pos" value="${esc(x.org)}" autocomplete="off"></label></div>`,
   `<span class="sp"></span><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="savePart('${tid}','${xid}')">Save</button>`,'','p_e');
}
function savePart(tid,xid){
  const n=$('p_e').value.trim();if(!n){$('p_e').focus();return}
  const x=S.trainings.find(t=>t.id===tid).parts.find(p=>p.id===xid);x.name=n;x.org=$('p_o').value.trim();save();closeDlg();render();
}
function delPart(tid,xid){const t=S.trainings.find(x=>x.id===tid),x=t.parts.find(p=>p.id===xid),i=t.parts.indexOf(x);t.parts=t.parts.filter(p=>p.id!==xid);save();render();toast(x.name+' removed.','Undo',()=>{t.parts.splice(Math.min(i,t.parts.length),0,x);save();render()})}
function previewCert(tid,i){
  const t=S.trainings.find(x=>x.id===tid);if(!t||!t.parts.length)return;
  i=clamp(i||0,0,t.parts.length-1);const x=t.parts[i],w=Math.min(860,window.innerWidth-90);
  openDlg('Certificate preview',certHTML(t,x,w/960),
   `<button class="btn" ${i?'':'disabled'} onclick="previewCert('${tid}',${i-1})">Previous</button><span class="small">${i+1} of ${t.parts.length}</span><button class="btn" ${i<t.parts.length-1?'':'disabled'} onclick="previewCert('${tid}',${i+1})">Next</button><span class="sp"></span><button class="btn" onclick="closeDlg()">Close</button><button class="btn primary" onclick="certs('${tid}','${x.id}')">${ic('dl')}Download this certificate</button>`,'xl');
}

/* ----- reports, delivery forms, exports ----- */
function reportDlg(){
  const p=proj(S.sel);if(!p)return;
  openDlg('Generate report',`<div class="f"><label class="w">Report type<select id="r_t"><option value="pp">Project Progress Report</option><option value="tr">Technical Report</option></select></label>
   <label>Period from<input id="r_a" type="date" value="${p.ntp||''}"></label><label>Period to<input id="r_b" type="date" value="${day(0)}"></label>
   <label class="w">Highlights or technical findings <small>Optional. Added to the summary or findings section.</small><textarea id="r_h" rows="3"></textarea></label>
   <label class="w">Issues and risks <small>Overdue tasks are listed automatically.</small><textarea id="r_i" rows="2"></textarea></label>
   <label class="w">Recommendations or next steps <small>Optional</small><textarea id="r_n" rows="2"></textarea></label></div>`,
   `<span class="sp"></span><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="makeReport('${p.id}')">${ic('dl')}Download report</button>`,'wide');
}
async function makeReport(pid){
  const p=proj(pid),o={t:$('r_t').value,a:$('r_a').value,b:$('r_b').value,h:$('r_h').value.trim(),i:$('r_i').value.trim(),n:$('r_n').value.trim()};
  const no=(o.t==='tr'?'TR-':'PPR-')+String(S.rpn+1).padStart(4,'0');
  try{
    await saveFile({filename:no+' '+p.name.replace(/[^\w\- ]/g,'')+'.pdf',data:reportPdf(p,o,no)});
    S.rpn++;const did=logDoc(o.t,no,p.id,no+' '+p.name.replace(/[^\w\- ]/g,'')+'.pdf');closeDlg();toast(no+' saved as PDF.','Request signatures',()=>requestSign(did));render();
  }catch(e){if(!e||e.code!=='declined')toast('Could not save the report.')}
}
async function makeDR(blank){
  let items=[],pid=null;
  if(!blank){
    items=S.deliv.filter(x=>selD.has(x.id));
    if(!items.length)items=dItems();
    if(!items.length){toast('Add or select deliverables first.');return}
    const ps=[...new Set(items.map(x=>x.pid))];
    if(ps.length>1){toast('A delivery form covers one project. Open a project first, or select items from one project.');return}
    pid=ps[0];
  }
  const dr=blank?'':'DF-'+String(S.drn+1).padStart(4,'0');
  try{
    await saveFile({filename:(blank?'Delivery-Form-template':dr)+'.pdf',data:await formPdf(items,pid&&proj(pid),dr)});
    if(!blank){
      S.drn++;items.forEach(x=>{x.dr=dr});selD.clear();const did=logDoc('df',dr,pid,dr+'.pdf');save();render();
      const pend=items.filter(x=>!x.delivered);
      if(pend.length)toast(dr+' saved.',`Mark ${pend.length} as delivered`,()=>{pend.forEach(x=>{x.delivered=true;x.date=day(0)});save();render()});
      else toast(dr+' saved.');
    }
  }catch(e){if(!e||e.code!=='declined')toast('Could not save the file.')}
}
function exportCSV(){
  const rows=[['Project','Deliverable','Qty','Unit','S/N','Status','Delivery date','Form no.','Notes']];
  dItems().forEach(x=>{const p=proj(x.pid);rows.push([p?p.name:'',x.name,x.qty,x.unit,x.sn||'',x.delivered?'Delivered':'Undelivered',x.date||'',x.dr||'',x.notes||''])});
  const csv=rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  saveFile({filename:'deliverables.csv',data:csv}).catch(e=>{if(!e||e.code!=='declined')toast('Could not save the file.')});
}
function sumRows(y){return S.projects.filter(p=>y==='all'||yr(p)===y).sort((a,b)=>(yr(a)+(cOf(a).name||'')+a.name).localeCompare(yr(b)+(cOf(b).name||'')+b.name))}
async function dlSummary(){
  const y=$('s_y').value,f=$('s_f').value,ps=sumRows(y),lb=y==='all'?'All years':'Year '+y;
  if(!ps.length){toast('No projects for '+lb+' yet.');return}
  const fn='Project Summary - '+lb;
  try{
    if(f==='csv'){
      const rows=[['Year','Client','Project','NTP date','Days','Deadline','Progress %','Tasks done','Tasks total','Deliverables delivered','Deliverables total','Status']];
      ps.forEach(p=>{const s=pStat(p);rows.push([yr(p),cOf(p).name||'',p.name,p.ntp||'',p.days||'',p.due||'',s.pct,s.dn,s.T,s.dd,s.D,s.st])});
      await saveFile({filename:fn+'.csv',data:rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')});
    }else await saveFile({filename:fn+'.pdf',data:summaryPdf(ps,y,lb)});
    toast('Summary saved.');
  }catch(e){if(!e||e.code!=='declined')toast('Could not save the summary.')}
}

function openSettings(){
  const g=sigs(),samp=hasSample();
  const sg=(k,s)=>`<label>${k==='l'?'Left':'Right'} name<input id="${k}_n" value="${esc(s.name)}" onchange="saveSig()" autocomplete="off"></label><label>${k==='l'?'Left':'Right'} title<input id="${k}_t" value="${esc(s.title)}" onchange="saveSig()" autocomplete="off"></label><label class="w">${k==='l'?'Left':'Right'} organization or trainer<input id="${k}_o" value="${esc(s.org)}" onchange="saveSig()" autocomplete="off"></label>`;
  openDlg('Settings',`
   <div class="sec"><h3>Your name</h3><span class="small">Used in the greeting and as "Prepared by" on every delivery form and report.</span><div class="f"><label class="w"><span class="sr">Your name</span><input id="s_me" value="${esc(S.me)}" placeholder="Full name" onchange="setMe(this.value)" autocomplete="name"></label></div></div>
   ${sgSettings()}
   <div class="sec"><h3>Certificate signatories</h3><span class="small">The left block always prints. The right block prints the trainer when a training has one.</span><div class="f">${sg('l',g.l)}${sg('r',g.r)}</div></div>
   <div class="sec"><h3>Project summary</h3><span class="small">Client, NTP, deadline, progress and deliverables for each project.</span><div class="f"><label>Year<select id="s_y">${['all',...years()].map(y=>`<option value="${y}" ${y===S.year?'selected':''}>${y==='all'?'All years':'Year '+y+' only'}</option>`).join('')}</select></label><label>Format<select id="s_f"><option value="pdf">PDF</option><option value="csv">CSV (opens in Excel)</option></select></label></div><div style="margin-top:12px"><button class="btn" onclick="dlSummary()">${ic('dl')}Download summary</button></div></div>
   <div class="sec"><h3>Your data</h3><span class="small">Everything is saved in this browser only. Back it up to keep a copy or to move to another computer.</span><div class="tr-act"><button class="btn" onclick="backup()">${ic('dl')}Back up data</button><label class="btn file-btn">Restore from backup<input type="file" id="s_file" accept=".json,application/json" onchange="restore(this.files[0])"></label>${samp?`<button class="btn" onclick="askSample()">Remove sample data</button>`:''}<button class="btn danger" onclick="askErase()">Erase everything</button></div></div>
   <div class="saved" id="s_saved" role="status"></div>`,
   `<span class="sp"></span><button class="btn primary" onclick="closeDlg()">Done</button>`,'wide');
}
async function backup(){try{await saveFile({filename:'MITSI-backup-'+day(0)+'.json',data:JSON.stringify(S,null,1)});toast('Backup saved.')}catch(e){if(!e||e.code!=='declined')toast('Could not save the backup.')}}
function restore(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){toast('That file is not a valid backup.');return}
    if(!d||!Array.isArray(d.projects)){toast('That file is not a MITSI backup.');return}
    ask('Restore this backup?',`This replaces everything in this browser with the backup: ${d.projects.length} projects and ${(d.tasks||[]).length} tasks.`,'Restore',()=>{S=d;norm();save();render();toast('Backup restored.')},true)};
  r.onerror=()=>toast('Could not read that file.');
  r.readAsText(f);
}
function askSample(){ask('Remove sample data?','The sample client, projects, tasks, deliverables and training are deleted. Anything you added yourself stays.','Remove sample data',removeSample,true)}
function removeSample(){
  const ids=new Set(S.projects.filter(p=>p.sample).map(p=>p.id));
  S.projects=S.projects.filter(p=>!ids.has(p.id));S.tasks=S.tasks.filter(t=>!ids.has(t.pid));S.deliv=S.deliv.filter(x=>!ids.has(x.pid));S.trainings=S.trainings.filter(x=>!ids.has(x.pid)&&!x.sample);
  S.clients=S.clients.filter(c=>!(c.sample&&!S.projects.some(p=>p.cid===c.id)));S.sel='all';save();render();toast('Sample data removed.');
}
function askErase(){ask('Erase everything?','All clients, projects, tasks, deliverables and trainings in this browser are deleted. Back up first if you might need them.','Erase everything',()=>{
  S={sel:'all',view:'ov',year:String(new Date().getFullYear()),v2:1,me:S.me,cert:S.cert,drn:S.drn,rpn:S.rpn,clients:[],projects:[],tasks:[],deliv:[],trainings:[]};norm();save();render();toast('All data erased.')},true)}

/* ===== Wiring ===== */
document.addEventListener('click',()=>{const m=$('menu');if(m)m.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=$('menu');if(m)m.hidden=true;if(navOpen)navToggle(false)}});
$('dlg').addEventListener('close',()=>{afterClient=null});
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeDlg()});
$('dlg').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!['checkbox','file','button'].includes(e.target.type)){const b=$('dlg').querySelector('.acts .btn.primary');if(b){e.preventDefault();b.click()}}
});
const ct=$('content');
ct.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}});
ct.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(c){e.preventDefault();c.classList.add('over')}});
ct.addEventListener('dragleave',e=>{const c=e.target.closest('.col');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
ct.addEventListener('drop',e=>{const c=e.target.closest('.col');if(!c)return;e.preventDefault();const t=S.tasks.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(t&&t.status!==c.dataset.s){t.status=c.dataset.s;save()}render()});
render();

</script>
</body>
</html>
